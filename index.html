<!doctype html>
<html lang="tr" style="background-color: #03050a; background: #03050a;">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#03050a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Survi Run - Horde Roguelite</title>
    <style>
      /* CRITICAL PRE-RENDER & INTRO LAYOUT (Zero White Flash & Zero Layout Shift) */
      html, body, #app {
        background-color: #03050a !important;
        background: #03050a !important;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #cybercore-intro-stage {
        position: fixed;
        inset: 0;
        z-index: 999999;
        background: radial-gradient(circle at center, #0a1428 0%, #03050a 100%) !important;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        pointer-events: none;
        will-change: opacity, transform;
        transform: translateZ(0);
        transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s ease;
      }

      #cybercore-intro-stage.intro-hidden {
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }

      .logo-box {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        will-change: transform, opacity;
        transform: translateZ(0);
        animation: instantSnap 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      @keyframes instantSnap {
        0% { opacity: 0; transform: scale(0.86); }
        100% { opacity: 1; transform: scale(1); }
      }

      .vector-ci-logo {
        width: 130px !important;
        height: 130px !important;
        max-width: 130px !important;
        max-height: 130px !important;
        flex-shrink: 0;
        will-change: transform;
        transform: translateZ(0);
        filter: drop-shadow(0 0 16px rgba(0, 242, 254, 0.75));
        animation: logoPulse 3s ease-in-out infinite alternate;
      }

      @keyframes logoPulse {
        0% { transform: translateY(0px) scale(1) translateZ(0); }
        100% { transform: translateY(-4px) scale(1.02) translateZ(0); }
      }

      .brand-title {
        font-family: 'Orbitron', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 2.6rem;
        font-weight: 900;
        letter-spacing: 6px;
        background: linear-gradient(135deg, #ffffff 20%, #38bdf8 60%, #00f2fe 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1.1;
        position: relative;
        display: inline-block;
        overflow: hidden;
      }

      .brand-subtitle {
        font-family: 'Orbitron', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 0.92rem;
        font-weight: 800;
        color: #e2e8f0;
        letter-spacing: 10px;
        text-transform: uppercase;
        margin-right: -10px;
        opacity: 0.98;
      }
    </style>
    <audio id="cybercore-intro-audio" preload="auto"></audio>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body style="background-color: #03050a; background: #03050a; margin: 0; padding: 0; overflow: hidden;">

    <!-- CYBERCORE INTERACTIVE - STUDIO INTRO SPLASH SCREEN -->
    <div id="cybercore-intro-stage">
      <div class="intro-grid"></div>
      <div class="glow-aura"></div>
      <div class="logo-box" id="logo-box">
        <!-- Official CyberCore Cyber-Metal CI Vector Logo with locked dimensions -->
        <svg class="vector-ci-logo" width="130" height="130" style="width: 130px; height: 130px; max-width: 130px; max-height: 130px; flex-shrink: 0;" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="30%" stop-color="#cbd5e1" />
              <stop offset="70%" stop-color="#64748b" />
              <stop offset="100%" stop-color="#334155" />
            </linearGradient>
            <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#38bdf8" />
              <stop offset="100%" stop-color="#00f2fe" />
            </linearGradient>
            <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00f2fe" flood-opacity="0.9"/>
            </filter>
          </defs>

          <!-- 1. Dış Metalik Daire Arkı (C Harfinin Ana Gövdesi) -->
          <path d="M 125 35 A 72 72 0 1 0 90 172 L 90 148 A 48 48 0 1 1 112 56 Z" 
                fill="url(#metalGrad)" 
                stroke="#00f2fe" 
                stroke-width="1.5" 
                filter="url(#neonGlow)" />

          <!-- 2. Sağ Üst Köşe Çentik Bloğu (C Harfinin Üst Çentiği) -->
          <path d="M 134 26 L 160 48 L 144 65 L 122 46 Z" 
                fill="url(#metalGrad)" 
                stroke="#00f2fe" 
                stroke-width="1.5" 
                filter="url(#neonGlow)" />

          <!-- 3. İç 'i' Harfi Dikey Gövdesi -->
          <rect x="94" y="78" width="22" height="66" rx="2" 
                fill="url(#metalGrad)" 
                stroke="#00f2fe" 
                stroke-width="1.5" 
                filter="url(#neonGlow)" />

          <!-- 4. İç 'i' Harfinin Neon Mavi Kare Noktası -->
          <rect x="94" y="50" width="22" height="20" rx="2" 
                fill="url(#cyanGrad)" 
                stroke="#ffffff" 
                stroke-width="1" 
                filter="drop-shadow(0 0 10px #00f2fe)" />
        </svg>

        <!-- Brand Typography with Light Sweep Effect -->
        <h1 class="brand-title">
          CYBERCORE
          <div class="light-sweep"></div>
        </h1>
        <div class="brand-subtitle">INTERACTIVE</div>
      </div>
    </div>

    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
